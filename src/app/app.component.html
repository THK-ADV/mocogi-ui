<div class="layout">
  <!--  <mat-toolbar>-->
  <!--    <span>COPS<code>Modules</code></span>-->
  <!--  </mat-toolbar>-->
  <cops-th-koeln-bar></cops-th-koeln-bar>
  <div class="horizontal-container">
<!--    add ngIf-->
    <cops-app-rail *ngIf="!isMobile" [railItems]="railItems"></cops-app-rail>
    <mat-sidenav-container>
<!--      property bind opened to variable and bind that to hamburger button in bot bar -->
      <mat-sidenav [opened]="!isMobile" mode="side">
        <cops-nav-bar [navItems]="navItems"></cops-nav-bar>
      </mat-sidenav>
      <mat-sidenav-content>
        <div class="content">
          <main>
            <cops-alert></cops-alert>
            <router-outlet style="margin: 0; padding: 0"></router-outlet>
          </main>
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
</div>
